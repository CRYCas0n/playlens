[project]
name = "playlens"
version = "1.0.0"
description = "Game intelligence service over Metacritic data: platform-aware verdicts and evidence-backed review summaries"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
llm = ["anthropic>=0.40"]
images = ["Pillow>=10.0"]
html = ["lxml>=5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a database (SQLite by default, PostgreSQL when TEST_DATABASE_URL is set)",
    "contract: hits real external APIs; never runs in CI on pull requests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# The Release 0 research scripts are evidence, not source. They are kept exactly as they
# were run so their output stays reproducible; reformatting them would edit the record.
extend-exclude = ["docs/research-fixtures"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["E501"]
# The lexicons are word lists. A block of prose split on whitespace is far easier to
# review and extend than a hundred quoted strings, which is the point of these files.
"app/ai/corpus.py" = ["SIM905"]
"app/ai/validator.py" = ["SIM905"]
"app/adapters/llm/fixture.py" = ["SIM905"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.services.*", "app.domain.*", "app.normalizers.*", "app.parsers.*"]
disallow_untyped_defs = true
