# Production overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NOT VERIFIED: no Docker daemon was available while this was written. It has been checked
# as YAML and read against the base file, and it has never been built or run. Treat the
# first deployment as a test of this file rather than as a routine one.
#
# The database port is not published by the base file either, so forgetting this overlay
# cannot expose PostgreSQL. What it adds is hardening, not the absence of a hole.
#
# What it changes, and why each change matters:
#
#   * secrets come from the environment, never from a literal, and every one of them is
#     required rather than defaulted;
#   * restart policies, so a reboot brings the stack back;
#   * resource limits, so one runaway worker cannot take the host down with it. They are
#     ceilings rather than reservations, and every one of them is a variable: the
#     defaults are sized for the smallest host worth deploying on -- one core, 3 GB, with
#     other people's containers already on it -- because a default that refuses to start
#     is not a safe default. Docker rejects a `cpus` above the core count outright;
#   * log rotation, because JSON logs at this volume fill a disk in weeks.

name: playlens

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-playlens}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      # The job queue takes short locks and releases them; anything holding one for a
      # minute is a bug, and this makes it visible in the log instead of mysterious.
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=1000
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY:-768M}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    restart: unless-stopped
    # No `ports` here on purpose. Compose CONCATENATES this list across files rather
    # than replacing it, so an entry here would be added to the base file's, not
    # substituted for it -- two bindings for one port, the second failing to bind or,
    # worse, succeeding on 0.0.0.0. The bind address lives in the base file and is
    # changed with $API_BIND_HOST.
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-playlens}
      # An origin list, not a wildcard. Empty means same-origin only, which is correct
      # when the HTML and the API are served by this same process.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      PUBLIC_RATE_LIMIT_PER_MIN: ${PUBLIC_RATE_LIMIT_PER_MIN:-120}
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0.75}"
          memory: ${API_MEMORY:-768M}
    logging: *logging

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-playlens}
    deploy:
      # One process, one job at a time, by design. More throughput means more replicas.
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: "${WORKER_CPUS:-0.75}"
          memory: ${WORKER_MEMORY:-640M}
    logging: *logging

  scheduler:
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-playlens}
    deploy:
      # EXACTLY ONE, always. Two schedulers would enqueue every tick twice; the enqueue
      # is idempotent by key so the duplicate is skipped rather than run, but the second
      # process is doing nothing except adding a way to be confused.
      replicas: 1
      resources:
        limits:
          cpus: "${SCHEDULER_CPUS:-0.25}"
          memory: ${SCHEDULER_MEMORY:-256M}
    logging: *logging
